name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: bunx --no-install changeset version
          pr-title: Release
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Check release tag
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'any(.[]; .merged_at != null and .base.ref == "main" and .head.ref == "changeset-release/main")')
          if [ "$merged" = true ] && ! git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build binaries
        if: steps.tag.outputs.missing == 'true'
        run: |
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            bun build --compile --target="$target" src/cli.ts --outfile "dist/loadouts-$target"
          done
      - name: Create GitHub release
        if: steps.tag.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes
